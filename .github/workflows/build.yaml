on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: Checkout
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        - name: install docker emulation
          run: docker run --rm --privileged tonistiigi/binfmt:latest --install amd64,arm64
        - name: Set up buildx
          uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        - name: Login to ghcr.io
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_ACTOR: ${{ github.actor }}
          run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        - name: Build and push
          env:
            GITHUB_REPOSITORY: ${{ github.repository }}
            GITHUB_REF_NAME: ${{ github.ref_name }}
          run: |
            docker buildx build --platform linux/amd64,linux/arm64 -t "$(echo "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')" --push .
