name: Test basic Slack notification (unformatted)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Slack Notify action (unformatted path)
        id: action
        uses: .
        continue-on-error: true
        env:
          SLACK_WEBHOOK: "https://hooks.slack.com/services/FAKE/FAKE/FAKE"
          SLACK_CHANNEL: "test-channel"
          SLACK_USERNAME: "Test Bot"
          SLACK_TITLE: "Test Notification"
          SLACK_MESSAGE: "Hello from act test"
          SLACK_COLOR: "good"
          GITHUB_REF: "refs/heads/act-harness"
          GITHUB_EVENT_NAME: "push"

      - name: Assert action ran (succeeded or failed gracefully without real webhook)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no real Slack webhook available)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
